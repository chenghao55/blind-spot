<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b0e">
  <title>BLIND SPOT — Escape the unseen</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eef2ee;
      --muted: #8e9b9f;
      --blue: #80bdcf;
      --line: #303b40;
      --green: #a1c6a1
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--ink);
      font-family: Arial, "Microsoft JhengHei", sans-serif
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair
    }

    button {
      font: inherit;
      cursor: pointer;
      color: var(--ink);
      background: #162025;
      border: 1px solid #43545b;
      padding: 14px 23px;
      text-align: left;
      transition: background .15s
    }

    button:hover,
    button:focus-visible {
      background: #2b404a;
      outline: 1px solid var(--blue)
    }

    button.primary {
      background: #a8c7ce;
      color: #0b171c;
      border-color: #a8c7ce;
      font-weight: bold
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 9, 12, .93);
      padding: 32px;
      overflow: auto
    }

    .screen.hidden,
    .hidden {
      display: none !important
    }

    .panel {
      max-width: 760px;
      width: 100%
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--blue);
      margin-bottom: 24px
    }

    h1 {
      font-size: clamp(48px, 9vw, 100px);
      line-height: .9;
      letter-spacing: -5px;
      margin: 0 0 24px;
      font-weight: 900
    }

    h2 {
      font-size: 40px;
      letter-spacing: 1px;
      margin: 0 0 24px
    }

    .lead {
      color: #aeb9ba;
      line-height: 1.9;
      max-width: 510px;
      font-size: 14px
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin: 28px 0;
      flex-wrap: wrap
    }

    .footer {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      margin-top: 35px;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted)
    }

    .controls {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 12px;
      font-size: 14px;
      line-height: 1.6
    }

    .controls b {
      color: var(--blue);
      font-family: monospace
    }

    .controls span {
      color: #b3bfc2
    }

    .note {
      font-size: 12px;
      color: #8e9b9f;
      line-height: 1.8;
      margin-top: 22px
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      padding: 25px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between
    }

    .hud-top,
    .hud-bottom {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px
    }

    .badge {
      background: rgba(8, 13, 17, .9);
      border: 1px solid #344149;
      padding: 13px 16px
    }

    .floor {
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 2px
    }

    .small {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted)
    }

    .hp {
      margin-top: 8px;
      width: 145px;
      height: 3px;
      background: #29333b
    }

    .hp i {
      display: block;
      height: 100%;
      background: var(--blue)
    }

    #health {
      font: 13px monospace;
      display: block;
      margin-top: 10px
    }

    .gear {
      text-align: right;
      font: 13px monospace;
      line-height: 1.9
    }

    .gear strong {
      font-size: 24px;
      color: #dce8eb
    }

    .hud-bottom {
      align-items: flex-end
    }

    .hint {
      font-size: 11px;
      line-height: 1.9;
      color: #819298
    }

    #prompt {
      position: absolute;
      left: 50%;
      bottom: 112px;
      transform: translateX(-50%);
      padding: 12px 20px;
      background: #14232a;
      border: 1px solid #5b899a;
      font-size: 13px;
      white-space: nowrap
    }

    #toast {
      position: absolute;
      left: 50%;
      top: 95px;
      transform: translateX(-50%);
      color: #d5e5df;
      background: rgba(12, 21, 24, .9);
      padding: 10px 18px;
      font-size: 13px
    }

    #action {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      font-size: 12px;
      text-align: center;
      color: #cbd9dc
    }

    #action .track {
      height: 3px;
      background: #29353a;
      margin-top: 10px
    }

    #action-fill {
      height: 100%;
      background: var(--blue)
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      border-top: 1px solid var(--line);
      padding-top: 24px;
      margin-top: 28px
    }

    .stats div {
      color: var(--muted);
      font-size: 12px
    }

    .stats strong {
      display: block;
      font-size: 25px;
      color: var(--ink);
      margin-top: 8px
    }

    @media(max-width:600px) {
      #hud {
        padding: 12px
      }

      .hint {
        display: none
      }

      .controls {
        grid-template-columns: 110px 1fr;
        font-size: 12px
      }

      h1 {
        letter-spacing: -3px
      }

      .badge {
        padding: 9px
      }

      .screen {
        padding: 22px
      }

      .gear {
        font-size: 11px
      }
    }

    /* Readable UI sizes, including compact windows. */
    html,
    body {
      font-size: 18px
    }

    .panel {
      max-width: calc(800px*var(--menu-scale, 1))
    }

    .eyebrow,
    .footer {
      font-size: calc(14px*var(--menu-scale, 1))
    }

    .panel h1 {
      font-size: clamp(calc(48px*var(--menu-scale, 1)), 9vw, calc(100px*var(--menu-scale, 1)))
    }

    .panel h2 {
      font-size: calc(40px*var(--menu-scale, 1))
    }

    .panel button {
      font-size: calc(18px*var(--menu-scale, 1));
      padding: calc(14px*var(--menu-scale, 1)) calc(23px*var(--menu-scale, 1))
    }

    .lead {
      font-size: calc(18px*var(--menu-scale, 1));
      max-width: calc(640px*var(--menu-scale, 1))
    }

    .controls {
      font-size: calc(18px*var(--menu-scale, 1));
      grid-template-columns: calc(170px*var(--menu-scale, 1)) 1fr
    }

    .note {
      font-size: calc(16px*var(--menu-scale, 1))
    }

    .small {
      font-size: calc(14px*var(--hud-scale, 1));
      letter-spacing: 1.5px
    }

    .floor {
      font-size: calc(32px*var(--hud-scale, 1))
    }

    #health {
      font-size: calc(18px*var(--hud-scale, 1))
    }

    .gear {
      font-size: calc(18px*var(--corner-scale, 1))
    }

    .gear strong {
      font-size: calc(32px*var(--corner-scale, 1))
    }

    .hint {
      font-size: calc(15px*var(--corner-scale, 1));
      color: #a5b7bf
    }

    .stats div {
      font-size: calc(16px*var(--menu-scale, 1))
    }

    .stats strong {
      font-size: calc(32px*var(--menu-scale, 1))
    }

    #prompt {
      font-size: calc(18px*var(--corner-scale, 1));
      bottom: 124px;
      max-width: calc(100% - 24px);
      white-space: normal;
      text-align: center
    }

    #toast {
      font-size: calc(18px*var(--corner-scale, 1));
      top: 165px;
      max-width: calc(100% - 24px);
      text-align: center
    }

    #action {
      font-size: calc(16px*var(--corner-scale, 1));
      width: 260px;
      bottom: 80px
    }

    @media(max-width:600px) {
      .controls {
        grid-template-columns: 110px 1fr;
        font-size: 16px
      }

      .gear {
        font-size: calc(16px*var(--corner-scale, 1))
      }

      #health {
        font-size: calc(16px*var(--hud-scale, 1))
      }

      .small {
        font-size: calc(13px*var(--hud-scale, 1))
      }

      .lead {
        font-size: 17px
      }

      #toast {
        top: 155px;
        font-size: calc(16px*var(--corner-scale, 1))
      }

      #prompt {
        font-size: calc(17px*var(--corner-scale, 1))
      }
    }

    .minimap {
      position: absolute;
      right: 28px;
      bottom: 98px;
      padding: 12px;
      background: rgba(8, 13, 17, .94);
      border: 1px solid #344149
    }

    .minimap-title {
      font-size: calc(15px*var(--hud-scale, 1));
      color: #d0dde1;
      margin-bottom: 10px
    }

    #minimap {
      width: var(--minimap-size, 180px);
      height: var(--minimap-size, 180px);
      cursor: default
    }

    .minimap-legend {
      font-size: calc(13px*var(--hud-scale, 1));
      line-height: 1.8;
      color: #a5b7bf;
      margin-top: 8px
    }

    .menu-version {
      position: fixed;
      right: 28px;
      bottom: 24px;
      color: var(--muted);
      font: calc(12px*var(--menu-scale, 1)) monospace;
      letter-spacing: 2px
    }

    .manual .eyebrow {
      font-size: calc(14px*var(--manual-scale, 1));
      margin-bottom: calc(24px*var(--manual-scale, 1))
    }

    .manual h2 {
      font-size: calc(40px*var(--manual-scale, 1));
      margin-bottom: calc(24px*var(--manual-scale, 1))
    }

    .manual .controls {
      font-size: calc(18px*var(--manual-scale, 1));
      grid-template-columns: calc(170px*var(--manual-scale, 1)) 1fr;
      gap: calc(12px*var(--manual-scale, 1))
    }

    .manual .note {
      font-size: calc(16px*var(--manual-scale, 1));
      margin-top: calc(22px*var(--manual-scale, 1))
    }

    .manual .buttons {
      margin: calc(28px*var(--manual-scale, 1)) 0
    }

    .manual button {
      font-size: calc(18px*var(--manual-scale, 1));
      padding: calc(14px*var(--manual-scale, 1)) calc(23px*var(--manual-scale, 1))
    }

    @media(max-width:600px) {
      .minimap {
        right: 12px;
        top: 165px;
        bottom: auto;
        padding: 9px
      }

      #minimap {
        width: 140px;
        height: 140px
      }

      .minimap-legend {
        font-size: calc(12px*var(--hud-scale, 1))
      }

      .minimap-title {
        font-size: calc(14px*var(--hud-scale, 1))
      }
    }
  </style>
</head>

<body>
  <canvas id="world" aria-label="BLIND SPOT 遊戲畫面"></canvas>
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="badge">
        <div class="small">CURRENT FLOOR</div>
        <div class="floor" id="floor"></div><span id="health"></span>
        <div class="hp"><i id="hp-fill"></i></div>
      </div>
      <div class="badge gear" id="gear"></div>
    </div>
    <div id="toast" class="hidden" role="status"></div>
    <div id="prompt" class="hidden"></div>
    <div id="action" class="hidden"><span id="action-label"></span>
      <div class="track">
        <div id="action-fill"></div>
      </div>
    </div>
    <div class="minimap">
      <div class="minimap-title" id="minimap-title">小地圖</div><canvas id="minimap" aria-label="目前樓層已探索房間與玩家位置"></canvas>
      <div class="minimap-legend">藍點：你　琥珀：關門<br>↑ 上樓　↓ 下樓　綠框：出口</div>
    </div>
    <div class="hud-bottom">
      <div class="hint">W A S D &nbsp; 移動　 SHIFT &nbsp; 衝刺　 SPACE &nbsp; 突進<br>E &nbsp; 互動　 R &nbsp; 換彈　 F &nbsp; 治療　 V
        &nbsp; 切換武器</div>
      <div class="hint" style="text-align:right">BLIND SPOT / <span id="hud-version"></span><br>ESC &nbsp; 暫停</div>
    </div>
  </div>
  <div id="screen" class="screen">
    <div id="panel" class="panel"></div>
  </div>
  <script>
    'use strict';
    // All balance and generation parameters are kept here; units are world pixels / seconds.
    const CONFIG = Object.freeze({
      floors: 3, grid: 5, room: 300, wall: 12, doorWidth: 76, extraDoorChance: .22,
      playerRadius: 10, speed: 150, sprint: 1.7, dashDistance: 90, dashDuration: .15, dashCooldown: 1, hp: 100, viewAngle: 120 * Math.PI / 180,
      viewRooms: 1.5, sightRays: 190, interactionRange: 48,
      magSize: 6, startingAmmo: 0, pistolPickupAmmo: 6, pistolDamage: 25, pistolCooldown: .2, pistolSpread: 2 * Math.PI / 180,
      reloadTime: 1.5, healTime: 2, healAmount: 30, knifeDamage: 35, knifeRange: 45,
      knifeArc: 70 * Math.PI / 180, knifeCooldown: .6, knifeStealthKill: true, ammoChance: .35, medChance: .20, pistolChance: .10, emptyChance: .35,
      ammoMin: 1, ammoMax: 2, furnitureMin: 2, furnitureMax: 4, searchableFurnitureChance: .25,
      furniturePlacementAttempts: 50, furnitureGap: 26, furnitureWallMargin: 26,
      furnitureAnchorClearance: 20, doorwayCoverChance: .8, enemySpawnSamples: 48,
      safeStairArrivalRooms: true, enemyChance: .43, enemyRadius: 11, enemyHp: 50, enemySpeed: 43,
      enemyViewAngle: 120 * Math.PI / 180, enemyViewRooms: 1, enemyAimTime: .5,
      enemyTurnSpeed: 300 * Math.PI / 180, enemyHitTurnSpeed: 600 * Math.PI / 180, enemyAimTolerance: 10 * Math.PI / 180, enemyAlertGrace: .4,
      enemyInterval: 1.5, enemySpread: 6 * Math.PI / 180, enemyDamage: 30,
      bulletLife: .09, flashLife: .08, toastTime: 2.5, maxFrame: .04,
      colors: Object.freeze({
        wall: '#435562', wallEdge: '#718d9f', door: '#b87930', doorEdge: '#ffd08a',
        furniture: '#8c6238', furnitureEdge: '#e0b786', furnitureDetail: '#d3a372'
      }),
      roomFont: 16, stairFont: 26, exitFont: 14, minimapSize: 180,
      shotVolume: .65, enemyShotVolume: .35, reloadVolume: .55, knifeVolume: .6, maxEffectVoices: 8,
      footstepStride: 26, hearingRooms: 1.2, footstepOcclusionStrength: .5,
      footstepHintLife: .7, footstepHintRadius: 62, footstepHintSectors: 8, footstepHintArc: 24 * Math.PI / 180
    });
    const $ = id => document.getElementById(id), canvas = $('world'), ctx = canvas.getContext('2d');
    const GAME_VERSION = 'v1.0.0';
    const TAU = Math.PI * 2, SIZE = CONFIG.grid * CONFIG.room, TOTAL_ROOMS = CONFIG.floors * CONFIG.grid ** 2;
    const game = { mode: 'MENU', floors: [], currentFloor: CONFIG.floors, runTime: 0, player: null, stats: null, effects: [], footsteps: [], toast: null, interactable: null };
    const keys = new Set(), mouse = { x: 0, y: 0 }, camera = { x: 0, y: 0 };
    // External MP3 files are fetched and decoded after a user gesture. Audio is optional:
    // network, browser, or decode failures never block controls, timers, or combat.
    const AUDIO_FILES = Object.freeze({
      shot: './assets/audio/gun-shot.mp3',
      reload: './assets/audio/reload.mp3',
      knife: './assets/audio/knife.mp3'
    });
    const sound = {
      context: null, buffers: new Map(), voices: new Set(), reload: null, loading: null,
      load() {
        if (this.loading) return this.loading;
        this.loading = Promise.all(Object.entries(AUDIO_FILES).map(async ([name, url]) => {
          const response = await fetch(url, { cache: 'no-cache' }); if (!response.ok) throw new Error(`${response.status} ${url}`);
          const buffer = await this.context.decodeAudioData(await response.arrayBuffer()); this.buffers.set(name, buffer);
        })).catch(error => console.warn('Optional audio failed to load:', error));
        return this.loading;
      },
      unlock() {
        try {
          if (!this.context) {
            const AudioContext = window.AudioContext || window.webkitAudioContext; if (!AudioContext) return;
            this.context = new AudioContext();
            this.load();
          }
          this.context.resume().catch(() => { });
        } catch {/* Sound must never be required for play. */ }
      },
      play(name, volume) {
        const buffer = this.buffers.get(name); if (!buffer || this.context?.state !== 'running') return;
        try {
          if (name === 'reload') this.stopReload();
          else { const effects = [...this.voices].filter(v => v !== this.reload); if (effects.length >= CONFIG.maxEffectVoices) this.stop(effects[0]); }
          const source = this.context.createBufferSource(), gain = this.context.createGain();
          source.buffer = buffer; gain.gain.value = volume;
          if (name === 'reload') source.playbackRate.value = buffer.duration / CONFIG.reloadTime;
          source.connect(gain); gain.connect(this.context.destination);
          source.onended = () => { this.voices.delete(source); if (this.reload === source) this.reload = null; source.disconnect(); gain.disconnect(); };
          this.voices.add(source); if (name === 'reload') this.reload = source; source.start();
        } catch {/* Decoding or playback failure has no gameplay effect. */ }
      },
      stop(source) { if (!source) return; try { source.stop(); } catch { } this.voices.delete(source); if (this.reload === source) this.reload = null; },
      stopReload() { this.stop(this.reload); },
      stopAll() { for (const source of [...this.voices]) this.stop(source); },
      pause() { this.context?.suspend().catch(() => { }); }
    };
    let width = 0, height = 0, dpr = 1, lastTime = 0, controlsReturn = 'MENU', confirmRestart = false;
    const rand = (a, b) => a + Math.random() * (b - a), int = (a, b) => Math.floor(rand(a, b + 1));
    const pick = a => a[int(0, a.length - 1)], clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const angleDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
    const floorNow = () => game.floors[game.currentFloor - 1];
    const roomAt = (x, y) => clamp(Math.floor(y / CONFIG.room), 0, 4) * CONFIG.grid + clamp(Math.floor(x / CONFIG.room), 0, 4);
    const center = id => ({ x: (id % CONFIG.grid + .5) * CONFIG.room, y: (Math.floor(id / CONFIG.grid) + .5) * CONFIG.room });
    const boxDistance = (p, b) => Math.hypot(p.x - clamp(p.x, b.x, b.x + b.w), p.y - clamp(p.y, b.y, b.y + b.h));
    function notice(text) { game.toast = { text, time: CONFIG.toastTime }; }
    function rectHit(origin, dir, b, max = Infinity) {
      let lo = 0, hi = max;
      for (const [p, d, min, maxi] of [[origin.x, dir.x, b.x, b.x + b.w], [origin.y, dir.y, b.y, b.y + b.h]]) {
        if (Math.abs(d) < 1e-10) { if (p < min || p > maxi) return null; }
        else { let a = (min - p) / d, c = (maxi - p) / d; if (a > c) [a, c] = [c, a]; lo = Math.max(lo, a); hi = Math.min(hi, c); if (lo > hi) return null; }
      }
      return lo <= max ? lo : null;
    }
    function circleHit(o, d, c, r, max) { const x = o.x - c.x, y = o.y - c.y, b = x * d.x + y * d.y, q = x * x + y * y - r * r, disc = b * b - q; if (disc < 0) return null; const t = -b - Math.sqrt(disc); return t >= 0 && t <= max ? t : null; }
    function blockers(f) { return [...f.walls, ...f.doors.filter(d => !d.open).map(d => d.bounds), ...f.furniture.map(o => o.bounds)]; }
    function cast(o, angle, max, boxes, targets = []) {
      const d = { x: Math.cos(angle), y: Math.sin(angle) }; let t = max, target = null, blocker = null;
      for (const b of boxes) { const hit = rectHit(o, d, b, t); if (hit !== null && hit <= t) { t = hit; target = null; blocker = b; } }
      for (const c of targets) { const hit = circleHit(o, d, c, c.radius, t); if (hit !== null && hit < t) { t = hit; target = c; blocker = null; } }
      return { x: o.x + d.x * t, y: o.y + d.y * t, t, target, blocker };
    }
    function lineClear(a, b, boxes) { const len = distance(a, b); return cast(a, Math.atan2(b.y - a.y, b.x - a.x), len, boxes).t >= len - .01; }
    function overlapsCircle(p, r, b) { return boxDistance(p, b) < r - .001; }
    function canStand(p, r, boxes, actors = [], ignore = null) { return !boxes.some(b => overlapsCircle(p, r, b)) && !actors.some(a => a !== ignore && a.hp > 0 && distance(p, a) < r + a.radius - .01); }
    function moveActor(a, dx, dy, boxes, actors = [], bounds = null) {
      const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (a.radius * .6)));
      for (let i = 0; i < steps; i++)for (const axis of ['x', 'y']) {
        const next = { x: a.x, y: a.y }; next[axis] += (axis === 'x' ? dx : dy) / steps;
        if (bounds) { next.x = clamp(next.x, bounds.x + a.radius, bounds.x + bounds.w - a.radius); next.y = clamp(next.y, bounds.y + a.radius, bounds.y + bounds.h - a.radius); }
        if (canStand(next, a.radius, boxes, actors, a)) a[axis] = next[axis];
      }
    }

      const grad = ctx.createRadialGradient(p.x, p.y, 30, p.x, p.y, CONFIG.room * CONFIG.viewRooms); grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(.65, 'rgba(0,0,0,.12)'); grad.addColorStop(1, 'rgba(0,0,0,.85)'); ctx.fillStyle = grad; ctx.fillRect(p.x - 500, p.y - 500, 1000, 1000);
      ctx.restore();
      // The near-facing obstacle edge is visible exactly at the first ray intersection.
      const surfaceColors = new Map(f.furniture.map(o => [o.bounds, furniturePalette(o).edge]));
      for (const d of f.doors) surfaceColors.set(d.bounds, CONFIG.colors.doorEdge);
      ctx.lineWidth = 2.5;
      for (let i = 1; i < poly.length; i++) {
        const a = poly[i - 1], b = poly[i];
        if (a.blocker && a.blocker === b.blocker && distance(a, b) < 12) {
          ctx.strokeStyle = surfaceColors.get(a.blocker) || CONFIG.colors.wallEdge;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      drawActor(p, true); ctx.restore(); drawFootstepHints();
      // Mouse crosshair is input UI, never an indicator of concealed entities.
      if (game.mode === 'PLAYING') { ctx.strokeStyle = '#8cabb3'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(mouse.x - 6, mouse.y); ctx.lineTo(mouse.x - 2, mouse.y); ctx.moveTo(mouse.x + 2, mouse.y); ctx.lineTo(mouse.x + 6, mouse.y); ctx.moveTo(mouse.x, mouse.y - 6); ctx.lineTo(mouse.x, mouse.y - 2); ctx.moveTo(mouse.x, mouse.y + 2); ctx.lineTo(mouse.x, mouse.y + 6); ctx.stroke(); }
      updateHUD();
    }
    function updateHUD() {
      drawMinimap();
      const p = game.player; $('floor').textContent = `${game.currentFloor}F`; $('health').textContent = `HP ${Math.ceil(p.hp)} / ${CONFIG.hp}`; $('hp-fill').style.width = `${p.hp / CONFIG.hp * 100}%`;
      $('gear').innerHTML = `<span class="small">${p.weapon === 'pistol' ? 'PISTOL / 手槍' : 'KNIFE / 刀'}</span><br><strong>${p.hasPistol ? p.mag.toString().padStart(2, '0') : '—'}</strong> / ${p.reserveAmmo.toString().padStart(2, '0')}<br>補血藥 ${p.medkits} &nbsp; · &nbsp; ${p.hasPistol ? '手槍 ✓ · V 切換' : '手槍未取得'}`;
      $('gear').innerHTML += `<br><span class="small">SPACE 突進 · ${p.dash ? '突進中' : p.dashCooldown > 0 ? `${p.dashCooldown.toFixed(1)}s` : '就緒'}</span>`;
      const it = game.interactable; $('prompt').classList.toggle('hidden', !it || game.mode !== 'PLAYING'); if (it) $('prompt').textContent = it.label;
      $('toast').classList.toggle('hidden', !game.toast); if (game.toast) $('toast').textContent = game.toast.text;
      $('action').classList.toggle('hidden', !p.action); if (p.action) { $('action-label').textContent = p.action.type === 'reload' ? '換彈中 RELOADING' : '治療中 HEALING'; $('action-fill').style.width = `${p.action.elapsed / p.action.duration * 100}%`; }
    }
    function resize() { width = window.innerWidth; height = window.innerHeight; dpr = Math.min(window.devicePixelRatio || 1, 2); canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr); const zoom = viewZoom(), menuScale = Math.min(1.5, Math.max(1, zoom / 1.5)); document.documentElement.style.setProperty('--hud-scale', Math.max(1, zoom / 1.25)); document.documentElement.style.setProperty('--corner-scale', Math.min(1.3, Math.max(1, zoom / 1.75))); document.documentElement.style.setProperty('--menu-scale', menuScale); document.documentElement.style.setProperty('--manual-scale', Math.min(menuScale, Math.max(.8, (height - 64) / 770))); if (game.player) resetCamera(); }
    window.addEventListener('resize', resize);
    window.addEventListener('keydown', e => {
      if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ShiftLeft', 'ShiftRight', 'KeyE', 'KeyR', 'KeyF', 'KeyV', 'Escape', 'Space'].includes(e.code)) e.preventDefault();
      if (e.code === 'Escape' && !e.repeat) { if (game.mode === 'PLAYING') pause(); else if (game.mode === 'PAUSED') resume(); return; }
      if (game.mode !== 'PLAYING') return; keys.add(e.code); if (e.repeat) return;
      switch (e.code) { case 'Space': startDash(); break; case 'KeyE': interact(); break; case 'KeyR': beginAction('reload'); break; case 'KeyF': beginAction('heal'); break; case 'KeyV': switchWeapon(game.player.weapon === 'knife' ? 'pistol' : 'knife'); break; }
    });
    window.addEventListener('keyup', e => keys.delete(e.code)); window.addEventListener('blur', () => { keys.clear(); pause(); }); document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
    canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; }); canvas.addEventListener('mousedown', e => { if (e.button === 0) { mouse.x = e.clientX; mouse.y = e.clientY; attack(); } }); canvas.addEventListener('contextmenu', e => e.preventDefault());
    function frame(now) { const dt = Math.min((now - lastTime) / 1000, CONFIG.maxFrame); lastTime = now; if (game.mode === 'PLAYING') update(dt); render(); requestAnimationFrame(frame); }
    // Read-only developer entry point, run from the browser console. No assets or test files needed.
    window.BLIND_SPOT = { CONFIG, validate: () => validateBuilding(game.floors), testGeneration(count = 100) { let rooms = 0; for (let i = 0; i < count; i++) { const b = buildBuilding(); const errors = validateBuilding(b.floors, b.spawn); if (errors.length) throw new Error(errors.join(';')); rooms += b.floors.reduce((sum, f) => sum + f.rooms.length, 0); } return { runs: count, rooms, passed: true }; } };
    $('hud-version').textContent = GAME_VERSION; resize(); mouse.x = width / 2; mouse.y = height / 2 - 150; menu(); requestAnimationFrame(frame);
  </script>
