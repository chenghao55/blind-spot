<style>
:root{color-scheme:dark;--ink:#eef2ee;--muted:#8e9b9f;--blue:#80bdcf;--line:#303b40;--green:#a1c6a1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:Arial,"Microsoft JhengHei",sans-serif}canvas{display:block;width:100%;height:100%;cursor:crosshair}button{font:inherit;cursor:pointer;color:var(--ink);background:#162025;border:1px solid #43545b;padding:14px 23px;text-align:left;transition:background .15s}button:hover,button:focus-visible{background:#2b404a;outline:1px solid var(--blue)}button.primary{background:#a8c7ce;color:#0b171c;border-color:#a8c7ce;font-weight:bold}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,9,12,.93);padding:32px;overflow:auto}.screen.hidden,.hidden{display:none!important}.panel{max-width:760px;width:100%}.eyebrow{font-size:11px;letter-spacing:4px;color:var(--blue);margin-bottom:24px}h1{font-size:clamp(48px,9vw,100px);line-height:.9;letter-spacing:-5px;margin:0 0 24px;font-weight:900}h2{font-size:40px;letter-spacing:1px;margin:0 0 24px}.lead{color:#aeb9ba;line-height:1.9;max-width:510px;font-size:14px}.buttons{display:flex;gap:12px;margin:28px 0;flex-wrap:wrap}.footer{border-top:1px solid var(--line);padding-top:18px;margin-top:35px;font-size:11px;letter-spacing:2px;color:var(--muted)}.controls{display:grid;grid-template-columns:150px 1fr;gap:12px;font-size:14px;line-height:1.6}.controls b{color:var(--blue);font-family:monospace}.controls span{color:#b3bfc2}.note{font-size:12px;color:#8e9b9f;line-height:1.8;margin-top:22px}#hud{position:absolute;inset:0;pointer-events:none;padding:25px 28px;display:flex;flex-direction:column;justify-content:space-between}.hud-top,.hud-bottom{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.badge{background:rgba(8,13,17,.9);border:1px solid #344149;padding:13px 16px}.floor{font-size:27px;font-weight:bold;letter-spacing:2px}.small{font-size:10px;lett <body>
<canvas id="world" aria-label="BLIND SPOT 遊戲畫面"></canvas>
<div id="hud" class="hidden">
 <div class="hud-top"><div class="badge"><div class="small">CURRENT FLOOR</div><div class="floor" id="floor"></div><span id="health"></span><div class="hp"><i id="hp-fill"></i></div></div><div class="badge gear" id="gear"></div></div>
 <div id="toast" class="hidden" role="status"></div><div id="prompt" class="hidden"></div>
 <div id="action" class="hidden"><span id="action-label"></span><div class="track"><div id="action-fill"></div></div></div>
 <div class="hud-bottom"><div class="hint">W A S D &nbsp; 移動　 SHIFT &nbsp; 衝刺<br>E &nbsp; 互動　 R &nbsp; 換彈　 F &nbsp; 治療　 1 / 2 &nbsp; 武器</div><div class="hint" style="text-align:right">BLIND SPOT / V1.0<br>ESC &nbsp; 暫停</div></div>
</div>
<div id="screen" class="screen"><div id="panel" class="panel"></div></div>
<script>
'use strict';
// All balance and generation parameters are kept here; units are world pixels / seconds.
const CONFIG = Object.freeze({
 floors:5, grid:5, room:300, wall:12, doorWidth:76, extraDoorChance:.22,
 playerRadius:10, speed:150, sprint:1.7, hp:100, viewAngle:120*Math.PI/180,
 viewRooms:1.5, sightRays:190, cameraFollow:9, interactionRange:48,
 magSize:6, startingAmmo:6, pistolDamage:25, pistolSpread:2*Math.PI/180,
 reloadTime:1.5, healTime:2, healAmount:30, knifeDamage:35, knifeRange:30,
 knifeArc:70*Math.PI/180, knifeCooldown:.6, ammoChance:.55, medChance:.35,
 ammoMin:2, ammoMax:4, furnitureMin:2, furnitureMax:4,
 enemyChance:.43, enemyRadius:11, enemyHp:50, enemySpeed:43,
 enemyViewAngle:120*Math.PI/180, enemyViewRooms:1, enemyAimTime:.5,
 enemyInterval:1.5, enemySpread:6*Math.PI/180, enemyDamage:15,
 bulletLife:.09, flashLife:.08, toastTime:2.5, maxFrame:.04, zoom:1
});
const $=id=>document.getElementById(id), canvas=$('world'), ctx=canvas.getContext('2d');
const TAU=Math.PI*2, SIZE=CONFIG.grid*CONFIG.room;
const game={mode:'MENU',floors:[],currentFloor:5,runTime:0,player:null,stats:null,effects:[],toast:null,interactable:null};
const keys=new Set(), mouse={x:0,y:0}, camera={x:0,y:0};
let width=0,height=0,dpr=1,lastTime=0,controlsReturn='MENU',confirmRestart=false;
const rand=(a,b)=>a+Math.random()*(b-a), int=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[int(0,a.length-1)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angleDiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));
const floorNow=()=>game.floors[game.currentFloor-1];
const roomAt=(x,y)=>clamp(Math.floor(y/CONFIG.room),0,4)*CONFIG.grid+clamp(Math.floor(x/CONFIG.room),0,4);
const center=id=>({x:(id%CONFIG.grid+.5)*CONFIG.room,y:(Math.floor(id/CONFIG.grid)+.5)*CONFIG.room});
const boxDistance=(p,b)=>Math.hypot(p.x-clamp(p.x,b.x,b.x+b.w),p.y-clamp(p.y,b.y,b.y+b.h));
function notice(text){game.toast={text,time:CONFIG.toastTime};}
function rectHit(origin,dir,b,max=Infinity){
 let lo=0,hi=max;
 for(const [p,d,min,maxi] of [[origin.x,dir.x,b.x,b.x+b.w],[origin.y,dir.y,b.y,b.y+b.h]]){
  if(Math.abs(d)<1e-10){if(p<min||p>maxi)return null;}
  else{let a=(min-p)/d,c=(maxi-p)/d;if(a>c)[a,c]=[c,a];lo=Math.max(lo,a);hi=Math.min(hi,c);if(lo>hi)return null;}
 }
 return lo<=max?lo:null;
}
function circleHit(o,d,c,r,max){const x=o.x-c.x,y=o.y-c.y,b=x*d.x+y*d.y,q=x*x+y*y-r*r,disc=b*b-q;if(disc<0)return null;const t=-b-Math.sqrt(disc);return t>=0&&t<=max?t:null;}
function blockers(f){return [...f.walls,...f.doors.filter(d=>!d.open).map(d=>d.bounds),...f.furniture.map(o=>o.bounds)];}
function cast(o,angle,max,boxes,targets=[]){
 const d={x:Math.cos(angle),y:Math.sin(angle)};let t=max,target=null;
 for(const b of boxes){const hit=rectHit(o,d,b,t);if(hit!==null&&hit<=t){t=hit;target=null;}}
 for(const c of targets){const hit=circleHit(o,d,c,c.radius,t);if(hit!==null&&hit<t){t=hit;target=c;}}
 return {x:o.x+d.x*t,y:o.y+d.y*t,t,target};
}
function lineClear(a,b,boxes){const len=distance(a,b);return cast(a,Math.atan2(b.y-a.y,b.x-a.x),len,boxes).t>=len-.01;}
function overlapsCircle(p,r,b){return boxDistance(p,b)<r-.001;}
function canStand(p,r,boxes,actors=[],ignore=null){return !boxes.some(b=>overlapsCircle(p,r,b))&&!actors.some(a=>a!==ignore&&a.hp>0&&distance(p,a)<r+a.radius-.01);}
function moveActor(a,dx,dy,boxes,actors=[],bounds=null){
 const steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(a.radius*.6)));
 for(let i=0;i<steps;i++)for(const axis of ['x','y']){
  const next={x:a.x,y:a.y};next[axis]+=(axis==='x'?dx:dy)/steps;
  if(bounds){next.x=clamp(next.x,bounds.x+a.radius,bounds.x+bounds.w-a.radius);next.y=clamp(next.y,bounds.y+a.radius,bounds.y+bounds.h-a.radius);}
  if(canStand(next,a.radius,boxes,actors,a))a[axis]=next[axis];
 }
}
// 1. Shell, menus, loop and HUD.
function showPanel(html){$('screen').classList.remove('hidden');$('panel').innerHTML=html;}
const controlsHTML=`<div class="eyebrow">FIELD MANUAL / 操作說明</div><h2>看清，再前進。</h2><div class="controls"><b>W A S D</b><span>移動；Shift 衝刺，中斷換彈與治療</span><b>滑鼠 / 左鍵</b><span>瞄準 / 單擊攻擊（按住不連射）</span><b>E</b><span>操作最近的門、搜尋家具、使用樓梯或逃出</span><b>R / F</b><span>換彈 1.5 秒 / 治療 2 秒，可正常走路</span><b>1 / 2</b><span>手槍 / 刀（需搜尋取得）；切武器中斷動作</span><b>Esc</b><span>暫停 / 恢復</span></div><p class="note">從 5F 尋找下樓梯，到 1F 綠色出口旁按 E。擊殺不是通關條件。<br>視野之外完全黑暗；家具、牆壁與關門會擋住視線及子彈。守衛不會離開原房。<br>書桌與衣櫥可各搜尋一次。補血藥完成治療才消耗；衝刺會中斷治療。</p><div class="buttons"><button data-do="back">返回 Back</button></div>`;
function menu(){game.mode='MENU';$('hud').classList.add('hidden');showPanel(`<div class="eyebrow">A FIVE-FLOOR SURVIVAL / 01</div><h1>BLIND<br>SPOT<span style="color:#80bdcf">.</span></h1><p class="lead">黑暗裡，活著離開才是目標。<br>你在五樓。找到樓梯，穿過未知的房間，<br>從一樓逃出這棟大樓。</p><div class="buttons"><button class="primary" data-do="start">開始遊戲 &nbsp; Start Game ↗</button><button data-do="controls">操作說明 &nbsp; Controls</button></div><div class="footer">125 ROOMS &nbsp; / &nbsp; ONE WAY OUT &nbsp; / &nbsp; NO SECOND CHANCES</div>`);}
function pause(){if(game.mode!=='PLAYING')return;game.mode='PAUSED';keys.clear();pausePanel();}
function pausePanel(){confirmRestart=false;showPanel(`<div class="eyebrow">SIGNAL HELD / 遊戲暫停</div><h2>PAUSED</h2><p class="lead">時間已停止。準備好再走。</p><div class="buttons"><button class="primary" data-do="resume">繼續 Resume</button><button data-do="controls">操作說明 Controls</button><button data-do="restart-confirm">重新開始 Restart</button></div>`);}
function resume(){game.mode='PLAYING';keys.clear();$('screen').classList.add('hidden');lastTime=performance.now();}
function showControls(){controlsReturn=game.mode;if(game.mode==='PLAYING'){pause();controlsReturn='PAUSED';}showPanel(controlsHTML);}
function formatTime(t){return `${Math.floor(t/60).toString().padStart(2,'0')}:${Math.floor(t%60).toString().padStart(2,'0')}`;}
function finish(won){game.mode=won?'VICTORY':'GAME_OVER';keys.clear();$('hud').classList.add('hidden');const p=game.player;showPanel(`<div class="eyebrow">${won?'YOU MADE IT OUT / 逃出生天':'RUN TERMINATED / 永久死亡'}</div><h2>${won?'ESCAPED':'GAME OVER'}</h2><p class="lead">${won?'門外，是新的空氣。你活著離開了。':'黑暗吞沒了你的足跡。下一次，會是另一棟大樓。'}</p><div class="stats"><div>存活時間<strong>${formatTime(game.runTime)}</strong></div><div>擊殺數<strong>${game.stats.kills}</strong></div>${won?`<div>進入過的房間<strong>${game.stats.visitedRoomIds.size} / 125</strong></div><div>剩餘 HP<strong>${Math.ceil(p.hp)}</strong></div>`:`<div>到達最低樓層<strong>${game.stats.lowestFloor}F</strong></div>`}</div><div class="buttons"><button class="primary" data-do="start">全新開始 Restart ↗</button><button data-do="menu">主選單</button></div>`);}
$('screen').addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(!b)return;switch(b.dataset.do){case 'start':startGame();break;case 'menu':menu();break;case 'resume':resume();break;case 'controls':showControls();break;case 'back':controlsReturn==='MENU'?menu():pausePanel();break;case 'restart-confirm':confirmRestart=true;showPanel(`<div class="eyebrow">CONFIRM RESTART</div><h2>放棄這次逃生？</h2><p class="lead">目前進度將消失，整棟大樓會重新生成。</p><div class="buttons"><button data-do="resume">取消，繼續遊戲</button><button data-do="start">確認重新開始</button></div>`);break;}});
// 2. Connected building, physical walls, reserved indoor routes and validation.
function makeFloor(number){
 const f={number,rooms:Array.from({length:25},(_,id)=>({id,links:[]})),walls:[],doors:[],furniture:[],enemies:[],stairs:[],exit:null};
 const edges=new Set(),seen=new Set([int(0,24)]),stack=[...seen];
 const neighbors=id=>[id%5>0?id-1:-1,id%5<4?id+1:-1,id>=5?id-5:-1,id<20?id+5:-1].filter(x=>x>=0);
 const connect=(a,b)=>{const key=[a,b].sort((x,y)=>x-y).join(':');if(edges.has(key))return;edges.add(key);f.rooms[a].links.push(b);f.rooms[b].links.push(a);};
 while(stack.length){const a=stack[stack.length-1],options=neighbors(a).filter(b=>!seen.has(b));if(!options.length){stack.pop();continue;}const b=pick(options);connect(a,b);seen.add(b);stack.push(b);}
 for(let a=0;a<25;a++)for(const b of neighbors(a))if(a<b&&Math.random()<CONFIG.extraDoorChance)connect(a,b);
 const s=CONFIG.room,w=CONFIG.wall,gap=CONFIG.doorWidth;
 f.walls.push({x:0,y:0,w:SIZE,h:w},{x:0,y:SIZE-w,w:SIZE,h:w},{x:0,y:0,w,h:SIZE},{x:SIZE-w,y:0,w,h:SIZE});
 for(let row=0;row<5;row++)for(let col=0;col<5;col++){
  const id=row*5+col;
  for(const vertical of [true,false]){
   if(vertical?col===4:row===4)continue;
   const b=id+(vertical?1:5),has=edges.has(`${id}:${b}`),pos=vertical?(col+1)*s:(row+1)*s,start=(vertical?row:col)*s;
   const rect=(offset,length)=>vertical?{x:pos-w/2,y:start+offset,w,h:length}:{x:start+offset,y:pos-w/2,w:length,h:w};
   if(has){const side=(s-gap)/2;f.walls.push(rect(0,side),rect(side+gap,side));const bounds=rect(side,gap);f.doors.push({id:`${number}-d${id}-${b}`,roomA:id,roomB:b,bounds,vertical,open:false,x:bounds.x+bounds.w/2,y:bounds.y+bounds.h/2});}
   else f.walls.push(rect(0,s));
  }
 }
 return f;
}
function placeFurniture(f){
 const types=['desk','wardrobe','sofa','shelf'];
 for(const room of f.rooms){
  const c=center(room.id),slots=[[-81,-80],[79,-78],[-80,79],[80,80]].sort(()=>Math.random()-.5);
  for(let i=0,n=int(CONFIG.furnitureMin,CONFIG.furnitureMax);i<n;i++){
   const type=i===0?pick(['desk','wardrobe']):pick(types),[sx,sy]=slots[i],wide=type==='sofa'||type==='desk',w=wide?68:44,h=type==='shelf'?62:42;
   f.furniture.push({id:`${f.number}-f${room.id}-${i}`,roomId:room.id,type,bounds:{x:c.x+sx-w/2+rand(-6,6),y:c.y+sy-h/2+rand(-6,6),w,h},searchable:type==='desk'||type==='wardrobe',searched:false});
  }
 }
}
function reachableRoom(f,id){
 // Flood at player diameter resolution, with every door open. Reach all door centers,
 // center stair/exit anchors, and the complete ring around the reserved cross corridor.
 const s=CONFIG.room,step=15,n=s/step,mid=n/2,base={x:(id%5)*s,y:Math.floor(id/5)*s};
 const boxes=[...f.walls.filter(b=>b.x+b.w>=base.x&&b.x<=base.x+s&&b.y+b.h>=base.y&&b.y<=base.y+s),...f.furniture.filter(o=>o.roomId===id).map(o=>o.bounds)];
 const good=(x,y)=>x>=0&&y>=0&&x<=n&&y<=n&&canStand({x:base.x+x*step,y:base.y+y*step},CONFIG.playerRadius,boxes);
 const seen=new Set([`${mid},${mid}`]),queue=[[mid,mid]];
 for(let head=0;head<queue.length;head++){const [x,y]=queue[head];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,key=`${nx},${ny}`;if(!seen.has(key)&&good(nx,ny)){seen.add(key);queue.push([nx,ny]);}}}
 const required=[[mid,mid],[mid-2,mid],[mid+2,mid],[mid,mid-2],[mid,mid+2],[mid-2,mid+2],[mid+2,mid+2]];
 for(const d of f.doors)if(d.roomA===id||d.roomB===id)required.push([Math.round((d.x-base.x)/step),Math.round((d.y-base.y)/step)]);
 return required.every(([x,y])=>seen.has(`${x},${y}`));
}
function validateBuilding(floors,spawn){
 const errors=[];if(floors.length!==5)errors.push('floor count');
 for(const f of floors){const seen=new Set([0]),queue=[0];for(let i=0;i<queue.length;i++)for(const b of f.rooms[queue[i]].links)if(!seen.has(b)){seen.add(b);queue.push(b);}if(f.rooms.length!==25||seen.size!==25)errors.push(`F${f.number}: graph`);
  for(const r of f.rooms)if(!reachableRoom(f,r.id))errors.push(`F${f.number} R${r.id}: blocked`);
  for(const st of f.stairs){const dest=floors[st.toFloor-1].stairs.find(t=>t.id===st.id&&t.toFloor===f.number);if(!dest)errors.push('stairs pair');}
 }
 if(floors.reduce((n,f)=>n+f.stairs.length,0)!==8)errors.push('stair count');
 if(floors.filter(f=>f.exit).length!==1||!floors[0].exit)errors.push('exit');
 if(spawn&&floors[4].enemies.some(e=>e.roomId===spawn.roomId))errors.push('unsafe spawn');
 return errors;
}
function buildBuilding(){
 const floors=Array.from({length:5},(_,i)=>makeFloor(i+1));
 for(let lower=1;lower<=4;lower++){
  const a=floors[lower-1],b=floors[lower],ra=int(0,24),rb=int(0,24),id=`stairs-${lower}`;
  // Up/down anchors use separate sides of the center to remain individually selectable.
  const pa={...center(ra)},pb={...center(rb)};pa.x-=30;pb.x+=30;
  a.stairs.push({id,x:pa.x,y:pa.y,roomId:ra,toFloor:lower+1,toPosition:{x:pb.x,y:pb.y+30}});
  b.stairs.push({id,x:pb.x,y:pb.y,roomId:rb,toFloor:lower,toPosition:{x:pa.x,y:pa.y+30}});
 }
 const exitRoom=int(0,24),exitPos=center(exitRoom);floors[0].exit={id:'exit',roomId:exitRoom,x:exitPos.x,y:exitPos.y-30};
 const spawnRoom=int(0,24),spawn={...center(spawnRoom),roomId:spawnRoom};
 for(const f of floors){placeFurniture(f);for(const room of f.rooms)if(!reachableRoom(f,room.id))f.furniture=f.furniture.filter(o=>o.roomId!==room.id);
  for(const r of f.rooms){if(f.number===5&&r.id===spawnRoom)continue;if(Math.random()>CONFIG.enemyChance)continue;const c=center(r.id);f.enemies.push({id:`${f.number}-e${r.id}`,roomId:r.id,x:c.x,y:c.y+65,radius:CONFIG.enemyRadius,hp:CONFIG.enemyHp,angle:rand(0,TAU),state:'patrol',aim:0,cooldown:0,target:null,flash:0});}
 }
 const errors=validateBuilding(floors,spawn);if(errors.length)throw new Error(errors.join(', '));
 return {floors,spawn};
}
function startGame(){
 const {floors,spawn}=buildBuilding();game.floors=floors;game.currentFloor=5;game.runTime=0;game.effects=[];game.toast=null;game.interactable=null;
 game.player={x:spawn.x,y:spawn.y,radius:CONFIG.playerRadius,facing:-Math.PI/2,hp:CONFIG.hp,mag:CONFIG.magSize,reserveAmmo:CONFIG.startingAmmo,medkits:0,hasKnife:false,weapon:'pistol',action:null,knifeTimer:0,flash:0,hurt:0,sprinting:false};
 game.stats={kills:0,visitedRoomIds:new Set([`5:${spawn.roomId}`]),lowestFloor:5};keys.clear();resetCamera();resume();$('hud').classList.remove('hidden');notice('找到下樓梯，前往 1F 逃生出口。');
}
// 3. Shared doors, nearest legal interactions, one-time loot and persistent floors.
function interactionCandidates(){
 const p=game.player,f=floorNow(),items=[],boxes=blockers(f);
 const add=(obj,type,label,bounds=null)=>{const dist=bounds?boxDistance(p,bounds):distance(p,obj);if(dist>CONFIG.interactionRange)return;
  // Interactions cannot reach through a wall or another obstacle. For solids, stop just
  // short of their near surface so the target itself does not block the legal ray.
  const q=bounds?{x:clamp(p.x,bounds.x,bounds.x+bounds.w),y:clamp(p.y,bounds.y,bounds.y+bounds.h)}:obj;
  const len=distance(p,q),angle=Math.atan2(q.y-p.y,q.x-p.x);
  if(cast(p,angle,Math.max(0,len-.5),boxes).t<Math.max(0,len-.5)-.01)return;
  items.push({obj,type,label,dist});};
 for(const d of f.doors)add(d,'door',d.open?'E — 關門':'E — 開門',d.bounds);
 for(const o of f.furniture)if(o.searchable&&!o.searched)add(o,'search',`E — 搜尋${o.type==='desk'?'書桌':'衣櫥'}`,o.bounds);
 for(const st of f.stairs)add(st,'stairs',`E — ${st.toFloor<game.currentFloor?'下樓':'上樓'}至 ${st.toFloor}F`);
 if(f.exit)add(f.exit,'exit','E — 開啟逃生出口');
 return items.sort((a,b)=>a.dist-b.dist||a.obj.id.localeCompare(b.obj.id));
}
function loot(o){
 if(o.searched)return;o.searched=true;const p=game.player;
 const r=Math.random()*(p.hasKnife?CONFIG.ammoChance+CONFIG.medChance:1);
 if(r<CONFIG.ammoChance){const n=int(CONFIG.ammoMin,CONFIG.ammoMax);p.reserveAmmo+=n;notice(`找到 ${n} 發備用子彈`);}
 else if(r<CONFIG.ammoChance+CONFIG.medChance){p.medkits++;notice('找到 1 份補血藥');}
 else{p.hasKnife=true;notice('找到一把刀 — 按 2 裝備');}
}
function interact(){
 const candidate=interactionCandidates()[0];if(!candidate)return;const o=candidate.obj;
 if(candidate.type==='door'){
  if(o.open&&[game.player,...floorNow().enemies.filter(e=>e.hp>0)].some(a=>overlapsCircle(a,a.radius,o.bounds))){notice('門口有人，無法關門');return;}o.open=!o.open;
 }else if(candidate.type==='search')loot(o);
 else if(candidate.type==='stairs'){
  const destination=game.floors[o.toFloor-1],boxes=blockers(destination),anchor=destination.stairs.find(st=>st.id===o.id);
  const landings=[o.toPosition,...[0,Math.PI/2,Math.PI,-Math.PI/2].map(a=>({x:anchor.x+Math.cos(a)*28,y:anchor.y+Math.sin(a)*28}))];
  const landing=landings.find(q=>canStand(q,game.player.radius,boxes,destination.enemies));
  if(!landing){notice('樓梯另一端有人擋路');return;}
  game.currentFloor=o.toFloor;Object.assign(game.player,landing);game.player.action=null;game.effects=[];game.stats.lowestFloor=Math.min(game.stats.lowestFloor,game.currentFloor);resetCamera();notice(`已抵達 ${game.currentFloor}F`);
 }else if(candidate.type==='exit')finish(true);
}
// 4. Actual visibility polygon: uniform rays plus exact blocker corner rays.
function visibility(p,boxes){
 const half=CONFIG.viewAngle/2,range=CONFIG.room*CONFIG.viewRooms,angles=[];
 for(let i=0;i<=CONFIG.sightRays;i++)angles.push(-half+CONFIG.viewAngle*i/CONFIG.sightRays);
 for(const b of boxes){if(boxDistance(p,b)>range)continue;for(const [x,y] of [[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h],[b.x,b.y+b.h]]){
  const a=angleDiff(Math.atan2(y-p.y,x-p.x),p.facing);for(const offset of [-.00003,0,.00003])if(a+offset>=-half&&a+offset<=half)angles.push(a+offset);
 }}
 angles.sort((a,b)=>a-b);
 return angles.map(a=>cast(p,p.facing+a,range,boxes));
}
function viewSize(){return {w:width/CONFIG.zoom,h:height/CONFIG.zoom};}
function resetCamera(){const v=viewSize(),p=game.player;camera.x=clamp(p.x,v.w/2,Math.max(v.w/2,SIZE-v.w/2));camera.y=clamp(p.y,v.h/2,Math.max(v.h/2,SIZE-v.h/2));if(v.w>SIZE)camera.x=SIZE/2;if(v.h>SIZE)camera.y=SIZE/2;}
function updateCamera(dt){const old={...camera};resetCamera();const target={...camera},k=1-Math.exp(-CONFIG.cameraFollow*dt);camera.x=old.x+(target.x-old.x)*k;camera.y=old.y+(target.y-old.y)*k;}
function updateFacing(){const p=game.player;p.facing=Math.atan2((mouse.y-height/2)/CONFIG.zoom+camera.y-p.y,(mouse.x-width/2)/CONFIG.zoom+camera.x-p.x);}
// 5. Hitscan, knife sweep, deferred resource consumption and interruptions.
function beginAction(type){
 const p=game.player;if(p.action){notice('請先完成目前動作');return;}
 if(p.sprinting){notice('衝刺時無法操作');return;}
 if(type==='reload'&&(p.weapon!=='pistol'||p.mag>=CONFIG.magSize||p.reserveAmmo<=0))return;
 if(type==='heal'&&(p.medkits<=0||p.hp>=CONFIG.hp))return;
 p.action={type,elapsed:0,duration:type==='reload'?CONFIG.reloadTime:CONFIG.healTime};
}
function switchWeapon(weapon){const p=game.player;if(weapon==='knife'&&!p.hasKnife){notice('尚未找到刀');return;}if(p.weapon!==weapon){p.action=null;p.weapon=weapon;}}
function damageEnemy(e,amount){e.hp=Math.max(0,e.hp-amount);if(e.hp===0){e.state='dead';game.stats.kills++;}}
function attack(){
 if(game.mode!=='PLAYING')return;const p=game.player;updateFacing();
 if(p.sprinting||(keys.has('ShiftLeft')||keys.has('ShiftRight'))&&moving()||p.action)return;
 const f=floorNow(),boxes=blockers(f),enemies=f.enemies.filter(e=>e.hp>0);
 if(p.weapon==='pistol'){
  if(!p.mag){notice('彈匣已空 — 按 R 換彈');return;}p.mag--;p.flash=CONFIG.flashLife;
  const hit=cast(p,p.facing+rand(-CONFIG.pistolSpread,CONFIG.pistolSpread),SIZE*1.5,boxes,enemies);
  if(hit.target)damageEnemy(hit.target,CONFIG.pistolDamage);game.effects.push({type:'bullet',x:p.x,y:p.y,tx:hit.x,ty:hit.y,time:CONFIG.bulletLife,enemy:false});
 }else if(p.knifeTimer<=0){
  p.knifeTimer=CONFIG.knifeCooldown;game.effects.push({type:'knife',x:p.x,y:p.y,angle:p.facing,time:.16});
  // Sweep rays to each candidate's near surface; nearest obstacle/actor wins.
  const candidates=enemies.filter(e=>distance(p,e)<=CONFIG.knifeRange+e.radius&&Math.abs(angleDiff(Math.atan2(e.y-p.y,e.x-p.x),p.facing))<=CONFIG.knifeArc/2).sort((a,b)=>distance(p,a)-distance(p,b));
  const e=candidates.find(e=>cast(p,Math.atan2(e.y-p.y,e.x-p.x),CONFIG.knifeRange,boxes,enemies).target===e);if(e)damageEnemy(e,CONFIG.knifeDamage);
 }
}
function hurtPlayer(amount){const p=game.player;p.hp=Math.max(0,p.hp-amount);p.hurt=.18;if(p.hp===0)finish(false);}
function updateAction(dt){const p=game.player,a=p.action;if(!a)return;a.elapsed+=dt;if(a.elapsed<a.duration)return;
 if(a.type==='reload'){const count=Math.min(CONFIG.magSize-p.mag,p.reserveAmmo);p.mag+=count;p.reserveAmmo-=count;}
 else{p.medkits--;p.hp=Math.min(CONFIG.hp,p.hp+CONFIG.healAmount);}p.action=null;
}
// 6. Room-bound guards, directional detection and continuous aiming checks.
function updateEnemies(dt,boxes){
 const f=floorNow(),p=game.player;
 for(const e of f.enemies){if(e.hp<=0)continue;e.flash=Math.max(0,e.flash-dt);e.cooldown=Math.max(0,e.cooldown-dt);
  const angle=Math.atan2(p.y-e.y,p.x-e.x),sees=distance(p,e)<=CONFIG.room*CONFIG.enemyViewRooms&&Math.abs(angleDiff(angle,e.angle))<=CONFIG.enemyViewAngle/2&&lineClear(e,p,boxes);
  if(sees){e.state='aim';e.angle=angle;e.aim+=dt;if(e.aim>=CONFIG.enemyAimTime&&e.cooldown<=0){
   e.cooldown=CONFIG.enemyInterval;e.flash=CONFIG.flashLife;
   const targets=[p,...f.enemies.filter(a=>a!==e&&a.hp>0)],hit=cast(e,angle+rand(-CONFIG.enemySpread,CONFIG.enemySpread),SIZE*1.5,boxes,targets);
   game.effects.push({type:'bullet',x:e.x,y:e.y,tx:hit.x,ty:hit.y,time:CONFIG.bulletLife,enemy:true});if(hit.target===p)hurtPlayer(CONFIG.enemyDamage);
   if(game.mode!=='PLAYING')return;
  }}else{
   e.state='patrol';e.aim=0;
   const c=center(e.roomId),bounds={x:c.x-CONFIG.room/2+CONFIG.wall,y:c.y-CONFIG.room/2+CONFIG.wall,w:CONFIG.room-2*CONFIG.wall,h:CONFIG.room-2*CONFIG.wall};
   if(!e.target||distance(e,e.target)<8){let target=null;for(let i=0;i<12;i++){const q={x:c.x+rand(-110,110),y:c.y+rand(-110,110)};if(canStand(q,e.radius,boxes)&&lineClear(e,q,boxes)){target=q;break;}}e.target=target;}
   if(e.target){e.angle=Math.atan2(e.target.y-e.y,e.target.x-e.x);const before={x:e.x,y:e.y};moveActor(e,Math.cos(e.angle)*CONFIG.enemySpeed*dt,Math.sin(e.angle)*CONFIG.enemySpeed*dt,boxes,[p,...f.enemies],bounds);if(distance(before,e)<.02)e.target=null;}
  }
 }
}
function moving(){return keys.has('KeyW')||keys.has('KeyS')||keys.has('KeyA')||keys.has('KeyD');}
function update(dt){
 game.runTime+=dt;const p=game.player,f=floorNow(),boxes=blockers(f);
 let dx=Number(keys.has('KeyD'))-Number(keys.has('KeyA')),dy=Number(keys.has('KeyS'))-Number(keys.has('KeyW'));const n=Math.hypot(dx,dy);
 p.sprinting=n>0&&(keys.has('ShiftLeft')||keys.has('ShiftRight'));
 if(p.sprinting&&p.action){p.action=null;notice('動作已中斷');}
 const speed=CONFIG.speed*(p.sprinting?CONFIG.sprint:1);if(n)moveActor(p,dx/n*speed*dt,dy/n*speed*dt,boxes,f.enemies);
 updateCamera(dt);updateFacing();updateAction(dt);p.knifeTimer=Math.max(0,p.knifeTimer-dt);p.flash=Math.max(0,p.flash-dt);p.hurt=Math.max(0,p.hurt-dt);
 game.stats.visitedRoomIds.add(`${game.currentFloor}:${roomAt(p.x,p.y)}`);
 // Existing effects expire before new shots so even a slow frame shows muzzle flashes.
 game.effects=game.effects.filter(e=>(e.time-=dt)>0);if(game.toast&&(game.toast.time-=dt)<=0)game.toast=null;
 updateEnemies(dt,boxes);game.interactable=interactionCandidates()[0]||null;
}
// 7. Strictly clipped rendering, pause/input lifecycle and final status screens.
function drawRect(b,fill,stroke=null){ctx.fillStyle=fill;ctx.fillRect(b.x,b.y,b.w,b.h);if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.strokeRect(b.x+.5,b.y+.5,b.w-1,b.h-1);}}
function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=color;ctx.fill();}
function drawFurniture(o){const b=o.bounds;drawRect(b,o.searched?'#302d28':'#675443',o.searched?'#625a4d':'#a18b70');ctx.strokeStyle=o.searched?'#534b40':'#8b755c';ctx.lineWidth=2;
 if(o.type==='desk'){ctx.strokeRect(b.x+7,b.y+7,b.w-14,b.h-14);}
 else if(o.type==='wardrobe'){ctx.beginPath();ctx.moveTo(b.x+b.w/2,b.y+3);ctx.lineTo(b.x+b.w/2,b.y+b.h-3);ctx.stroke();}
 else if(o.type==='sofa'){ctx.strokeRect(b.x+8,b.y+9,b.w-16,b.h-18);}
 else{for(let y=12;y<b.h;y+=14){ctx.beginPath();ctx.moveTo(b.x+3,b.y+y);ctx.lineTo(b.x+b.w-3,b.y+y);ctx.stroke();}}
 if(o.searched){ctx.strokeStyle='#b7b3a3';ctx.beginPath();ctx.moveTo(b.x+b.w/2-5,b.y+b.h/2);ctx.lineTo(b.x+b.w/2-1,b.y+b.h/2+4);ctx.lineTo(b.x+b.w/2+6,b.y+b.h/2-5);ctx.stroke();}
}
function drawActor(a,player=false){
 const angle=player?a.facing:a.angle;
 if(a.hp<=0){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(angle);ctx.fillStyle='#462c2c';ctx.fillRect(-14,-7,28,14);ctx.strokeStyle='#704143';ctx.beginPath();ctx.moveTo(-7,-5);ctx.lineTo(7,5);ctx.moveTo(-7,5);ctx.lineTo(7,-5);ctx.stroke();ctx.restore();return;}
 circle(a.x,a.y,a.radius+2,player?'#1a3946':'#261719');circle(a.x,a.y,a.radius,player?(a.hurt>0?'#e5a3a3':'#7cbace'):'#873e44');
 ctx.save();ctx.translate(a.x,a.y);ctx.rotate(angle);ctx.fillStyle=player?'#c8dce2':a.state==='aim'?'#d1b4a6':'#9a7a70';const knife=player&&a.weapon==='knife';ctx.fillRect(5,-3,knife?18:a.state==='aim'||player?18:13,knife?3:5);
 if(a.flash>0&&!player){ctx.beginPath();ctx.moveTo(24,-2);ctx.lineTo(34,-6);ctx.lineTo(30,0);ctx.lineTo(35,5);ctx.lineTo(24,3);ctx.fillStyle='#f4d49b';ctx.fill();}ctx.restore();
}
function render(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,width,height);
 if(!game.player||game.mode==='MENU')return;
 const p=game.player,f=floorNow(),boxes=blockers(f),poly=visibility(p,boxes);
 ctx.save();ctx.translate(width/2,height/2);ctx.scale(CONFIG.zoom,CONFIG.zoom);ctx.translate(-camera.x,-camera.y);
 ctx.save();ctx.beginPath();ctx.moveTo(p.x,p.y);for(const pt of poly)ctx.lineTo(pt.x,pt.y);ctx.closePath();ctx.clip();
 ctx.fillStyle='#1c2225';ctx.fillRect(0,0,SIZE,SIZE);
 ctx.strokeStyle='#242c2f';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=SIZE;i+=30){ctx.moveTo(i,0);ctx.lineTo(i,SIZE);ctx.moveTo(0,i);ctx.lineTo(SIZE,i);}ctx.stroke();
 for(const room of f.rooms){const c=center(room.id);ctx.fillStyle='#333c3f';ctx.font='11px monospace';ctx.textAlign='center';ctx.fillText(`${f.number}${String(room.id+1).padStart(2,'0')}`,c.x,c.y+108);}
 for(const st of f.stairs){drawRect({x:st.x-17,y:st.y-18,w:34,h:36},'#2c4248','#76949e');ctx.fillStyle='#b0ced3';ctx.font='22px monospace';ctx.textAlign='center';ctx.fillText(st.toFloor>game.currentFloor?'↑':'↓',st.x,st.y+7);}
 if(f.exit){const o=f.exit;drawRect({x:o.x-25,y:o.y-10,w:50,h:20},'#315a45','#81bb8e');ctx.fillStyle='#c3e8c6';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText('EXIT',o.x,o.y+4);}
 for(const w of f.walls)drawRect(w,'#485156');
 for(const d of f.doors){if(!d.open)drawRect(d.bounds,'#85694c','#b29773');else{
  ctx.save();ctx.translate(d.x,d.y);if(!d.vertical)ctx.rotate(Math.PI/2);ctx.strokeStyle='#a88e6a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-CONFIG.doorWidth/2);ctx.lineTo(CONFIG.doorWidth*.7,-CONFIG.doorWidth/2);ctx.stroke();ctx.restore();
 }}
 for(const o of f.furniture)drawFurniture(o);
 for(const e of f.enemies)drawActor(e);
 for(const e of game.effects){ctx.strokeStyle=e.enemy?'#e2a178':'#e4d8b2';ctx.lineWidth=1.3;ctx.beginPath();if(e.type==='bullet'){ctx.moveTo(e.x,e.y);ctx.lineTo(e.tx,e.ty);}else{ctx.strokeStyle='#b1d4dc';ctx.arc(e.x,e.y,CONFIG.knifeRange,e.angle-CONFIG.knifeArc/2,e.angle+CONFIG.knifeArc/2);}ctx.stroke();}
 if(p.flash>0){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.facing);ctx.fillStyle='#f4d49b';ctx.beginPath();ctx.moveTo(23,-2);ctx.lineTo(34,-5);ctx.lineTo(30,1);ctx.lineTo(34,5);ctx.lineTo(23,2);ctx.fill();ctx.restore();}
 // A range falloff remains inside the visibility clip and never reveals unseen geometry.
 const grad=ctx.createRadialGradient(p.x,p.y,30,p.x,p.y,CONFIG.room*CONFIG.viewRooms);grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(.65,'rgba(0,0,0,.12)');grad.addColorStop(1,'rgba(0,0,0,.85)');ctx.fillStyle=grad;ctx.fillRect(p.x-500,p.y-500,1000,1000);
 ctx.restore();
 // The near-facing obstacle edge is visible exactly at the first ray intersection.
 ctx.strokeStyle='#637279';ctx.lineWidth=1.2;ctx.beginPath();for(let i=1;i<poly.length;i++)if(poly[i].t<CONFIG.room*CONFIG.viewRooms-.1&&poly[i-1].t<CONFIG.room*CONFIG.viewRooms-.1&&distance(poly[i],poly[i-1])<12){ctx.moveTo(poly[i-1].x,poly[i-1].y);ctx.lineTo(poly[i].x,poly[i].y);}ctx.stroke();
 drawActor(p,true);ctx.restore();
 // Mouse crosshair is input UI, never an indicator of concealed entities.
 if(game.mode==='PLAYING'){ctx.strokeStyle='#8cabb3';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(mouse.x-6,mouse.y);ctx.lineTo(mouse.x-2,mouse.y);ctx.moveTo(mouse.x+2,mouse.y);ctx.lineTo(mouse.x+6,mouse.y);ctx.moveTo(mouse.x,mouse.y-6);ctx.lineTo(mouse.x,mouse.y-2);ctx.moveTo(mouse.x,mouse.y+2);ctx.lineTo(mouse.x,mouse.y+6);ctx.stroke();}
 updateHUD();
}
function updateHUD(){
 const p=game.player;$('floor').textContent=`${game.currentFloor}F`;$('health').textContent=`HP ${Math.ceil(p.hp)} / ${CONFIG.hp}`;$('hp-fill').style.width=`${p.hp/CONFIG.hp*100}%`;
 $('gear').innerHTML=`<span class="small">${p.weapon==='pistol'?'PISTOL / 手槍':'KNIFE / 刀'}</span><br><strong>${p.mag.toString().padStart(2,'0')}</strong> / ${p.reserveAmmo.toString().padStart(2,'0')}<br>補血藥 ${p.medkits} &nbsp; · &nbsp; ${p.hasKnife?'刀 ✓':'刀 —'}`;
 const it=game.interactable;$('prompt').classList.toggle('hidden',!it||game.mode!=='PLAYING');if(it)$('prompt').textContent=it.label;
 $('toast').classList.toggle('hidden',!game.toast);if(game.toast)$('toast').textContent=game.toast.text;
 $('action').classList.toggle('hidden',!p.action);if(p.action){$('action-label').textContent=p.action.type==='reload'?'換彈中 RELOADING':'治療中 HEALING';$('action-fill').style.width=`${p.action.elapsed/p.action.duration*100}%`;}
}
function resize(){width=window.innerWidth;height=window.innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);if(game.player)resetCamera();}
window.addEventListener('resize',resize);
window.addEventListener('keydown',e=>{
 if(['KeyW','KeyA','KeyS','KeyD','ShiftLeft','ShiftRight','KeyE','KeyR','KeyF','Digit1','Digit2','Escape','Space'].includes(e.code))e.preventDefault();
 if(e.code==='Escape'&&!e.repeat){if(game.mode==='PLAYING')pause();else if(game.mode==='PAUSED')resume();return;}
 if(game.mode!=='PLAYING')return;keys.add(e.code);if(e.repeat)return;
 switch(e.code){case 'KeyE':interact();break;case 'KeyR':beginAction('reload');break;case 'KeyF':beginAction('heal');break;case 'Digit1':switchWeapon('pistol');break;case 'Digit2':switchWeapon('knife');break;}
});
window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{keys.clear();pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
canvas.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});canvas.addEventListener('mousedown',e=>{if(e.button===0){mouse.x=e.clientX;mouse.y=e.clientY;attack();}});canvas.addEventListener('contextmenu',e=>e.preventDefault());
function frame(now){const dt=Math.min((now-lastTime)/1000,CONFIG.maxFrame);lastTime=now;if(game.mode==='PLAYING')update(dt);render();requestAnimationFrame(frame);}
// Read-only developer entry point, run from the browser console. No assets or test files needed.
window.BLIND_SPOT={CONFIG,validate:()=>validateBuilding(game.floors),testGeneration(count=100){let rooms=0;for(let i=0;i<count;i++){const b=buildBuilding();const errors=validateBuilding(b.floors,b.spawn);if(errors.length)throw new Error(errors.join(';'));rooms+=b.floors.reduce((sum,f)=>sum+f.rooms.length,0);}return {runs:count,rooms,passed:true};}};
resize();mouse.x=width/2;mouse.y=height/2-150;menu();requestAnimationFrame(frame);
</script>
